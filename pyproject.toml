[project]
name = "memo"
version = "3.0.0"
description = "Memo unified MCP server (v3): durable memory + reusable skills over memo.db"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2",
  "fastembed>=0.3",
  "rapidfuzz>=3.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "peewee>=4.5.3",
  # Newest WITH a win64 wheel — pin DOWN if the newest lacks one, never build from source (§38, Q-03).
  "sqlite-vec>=0.1.6",
]

[project.scripts]
memo = "memo.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py runtime data: prompts.py loads prompts.json from its own package dir,
# so the wheel must carry it (otherwise FileNotFoundError in the container,
# where only the installed package exists).
[tool.setuptools.package-data]
memo = ["prompts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
