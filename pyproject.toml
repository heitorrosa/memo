[project]
name = "memo"
version = "3.0.0"
description = "Memo: durable memory + reusable skills over memo.db"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "fastembed>=0.3",
  "rapidfuzz>=3.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "peewee>=4.5.3",
  "sqlite-vec>=0.1.6",
]

[project.scripts]
memo = "memo.server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memo = ["prompts.json", "static/ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
