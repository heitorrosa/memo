server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;

    resolver __RESOLVER__ ipv6=off valid=30s;
    set $MEMO_API_TARGET __MEMO_API_TARGET__;

    location = /ui {
        return 302 /ui/;
    }

    location = /ui/ {
        alias /app/ui/;
        index index.html;
        add_header cache-control "no-cache" always;
    }

    location /ui/assets/ {
        alias /app/ui/assets/;
        add_header cache-control "public, max-age=31536000, immutable" always;
    }

    location /ui/ {
        alias /app/ui/;
        add_header cache-control "no-cache" always;
    }

    location /api/ {
        proxy_pass $MEMO_API_TARGET;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /mcp {
        proxy_pass $MEMO_API_TARGET;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /health {
        proxy_pass $MEMO_API_TARGET;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location = / {
        return 302 /ui/;
    }
}
