# nginx is the public face of the memo image: it serves the built dashboard
# and proxies the API to the memo server, so the dashboard and the API share
# one origin (no CORS anywhere, the client keeps calling relative /api/...).
#
# This file is a template: docker/entrypoint.sh renders it into
# /etc/nginx/conf.d/default.conf, replacing
#   __MEMO_API_TARGET__  the memo API upstream (http://host:port)
#   __RESOLVER__         the DNS server used to resolve that upstream

server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;

    resolver __RESOLVER__ ipv6=off valid=30s;
    set $MEMO_API_TARGET __MEMO_API_TARGET__;

    # The dashboard (vite build -> /app/ui). The cache policy is the one the
    # python static mount already documents: HTML revalidates on every load,
    # content-hashed assets are immutable.
    location = /ui {
        return 302 /ui/;
    }

    location = /ui/ {
        alias /app/ui/;
        index index.html;
        add_header cache-control "no-cache" always;
    }

    location /ui/assets/ {
        alias /app/ui/assets/;
        add_header cache-control "public, max-age=31536000, immutable" always;
    }

    location /ui/ {
        alias /app/ui/;
        add_header cache-control "no-cache" always;
    }

    # The API. The upstream variable carries no path, so the request URI
    # (/api/stats) is passed through untouched.
    location /api/ {
        proxy_pass $MEMO_API_TARGET;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # MCP is a streaming transport: no buffering, no read timeout.
    location /mcp {
        proxy_pass $MEMO_API_TARGET;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /health {
        proxy_pass $MEMO_API_TARGET;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location = / {
        return 302 /ui/;
    }
}
