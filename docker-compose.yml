services:
  memo:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./models:/models:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "/opt/memo/docker/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
